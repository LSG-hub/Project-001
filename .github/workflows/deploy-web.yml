name: Deploy website

# dev  -> Cloud Run web-dev -> dev.001.sreenivasgurram.com
# main -> Cloud Run web     -> 001.sreenivasgurram.com
# Signs in to Google Cloud with Workload Identity Federation: no keys stored in GitHub.
on:
  push:
    branches: [dev, main]
    paths:
      - apps/web/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_ID: project-001-474105
  REGION: asia-south1
  IMAGE: asia-south1-docker.pkg.dev/project-001-474105/web/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://001.sreenivasgurram.com' || 'https://dev.001.sreenivasgurram.com' }}
    env:
      SERVICE: ${{ github.ref_name == 'main' && 'web' || 'web-dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/701356728707/locations/global/workloadIdentityPools/github/providers/lsg-hub
          service_account: github-deployer@project-001-474105.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/web/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --quiet
